name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a mutable tag can be repointed at
      # different code by anyone able to push tags in those repositories.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # No DATABASE_URL and no MAILERSEND_API_KEY on purpose: every test
      # injects its own fakes, so a green run here proves the suite never
      # reaches Postgres or the provider.
      - run: npm test
